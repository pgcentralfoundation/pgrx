[package]
name = "cargo-pgrx"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Cargo subcommand for 'pgrx' to make Postgres extension development easy"
repository.workspace = true
documentation = "https://docs.rs/cargo-pgrx"
categories = ["development-tools::cargo-plugins", "command-line-utilities", "database"]
keywords = ["database", "postgres", "postgresql", "extension"]
readme = "README.md"
exclude = ["*.png"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
pgrx-pg-config.workspace = true
pgrx-sql-entity-graph.workspace = true

cargo_metadata.workspace = true
cargo_toml.workspace = true
clap-cargo.workspace = true
libc.workspace = true
regex.workspace = true
toml.workspace = true
toml_edit.workspace = true

arx-pack = "0.3.7" # RPM and DEB packages for `cargo pgrx package`
clap = { version = "4.4.2", features = ["env", "suggestions", "cargo", "derive", "wrap_help"] }
jobslot = "0.2.24" # as seen in gmake -j{N}
semver = "1.0.28" # checking pgrx versions match
tempfile = "3.27.0"

# emit better diagnostics
color-eyre = "0.6.5"
eyre.workspace = true
owo-colors.workspace = true
tracing = "0.1"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# for downloading things from the Postgres file servers
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["gzip", "platform-verifier", "rustls"] }
postgres = { version = "0.19.14", features = ["with-serde_json-1", "with-uuid-1"] }
uuid = { version = "1.29.1", features = ["v4"] }

# SQL schema generation
proc-macro2.workspace = true
quote.workspace = true
[dependencies.object]
version = "0.40.0"
default-features = false
features = [
    "read_core", "std", # we use object read-only and like having actual errors
    "coff", "elf", "macho", "pe", "xcoff", # support all object formats to allow cross-builds
]

# EDB publishes PostgreSQL for Windows as deflated zip archives, and Windows may not have `tar`.
# flate2 supplies the inflate backend that zip's `deflate-flate2` feature leaves to its users.
[target.'cfg(target_os = "windows")'.dependencies]
flate2 = "1"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
goldenfile = "1.11"

[lints.clippy]
or_fun_call = "allow" # kinda sus lint imo
too_many_arguments = "allow"
