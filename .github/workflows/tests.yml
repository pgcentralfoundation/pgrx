name: CI

on:
  push:
    branches:
      - develop
  pull_request: {}
  workflow_dispatch: {}

# A new push to a pull request cancels the pull request's earlier run. Each push to develop
# gets its own group, so develop runs are never cancelled or queued behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job stops after 30 minutes, so a hung test cannot hold a runner for GitHub's default of
# six hours. A cold run of the slowest job takes about 20.
env:
  # NB: Don't modify `RUSTFLAGS` here, since it would override the ones
  # configured by `.cargo/config.toml` on macOS.
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: "false"
  # Only pushes to develop save caches. Pull requests restore develop's newest caches, so their
  # caches cannot evict develop's from the repository's 10 GB of cache storage.
  SAVE_RUST_CACHE: ${{ github.ref == 'refs/heads/develop' || github.head_ref == 'ci-ten-minutes' }}

jobs:
  # Pull requests run only the jobs that test what the change touches; see tools/ci/src/plan.rs.
  # Pushes to develop run everything.
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, 'nogha')"
    outputs:
      lint: ${{ steps.plan.outputs.lint }}
      pg: ${{ steps.plan.outputs.pg }}
      crates: ${{ steps.plan.outputs.crates }}
      miri: ${{ steps.plan.outputs.miri }}
      cmacros_clang14: ${{ steps.plan.outputs.cmacros_clang14 }}
      bindgen_harness: ${{ steps.plan.outputs.bindgen_harness }}
      ui: ${{ steps.plan.outputs.ui }}
      bench: ${{ steps.plan.outputs.bench }}
      install_regression: ${{ steps.plan.outputs.install_regression }}
      runas: ${{ steps.plan.outputs.runas }}
      init: ${{ steps.plan.outputs.init }}
      variants: ${{ steps.plan.outputs.variants }}
      schema_release: ${{ steps.plan.outputs.schema_release }}
      beta: ${{ steps.plan.outputs.beta }}
      package: ${{ steps.plan.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's merge commit and its first parent, the base it merges into.
          fetch-depth: 2
      # The planner rarely changes, so its build is cached.
      - name: Restore the CI driver
        id: driver
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pgrx-ci
          key: pgrx-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/ci/**', 'Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build the CI driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: |
          tools/ci/setup.sh
          cargo build --locked -p pgrx-ci
          mkdir -p "$RUNNER_TEMP/pgrx-ci"
          cp target/debug/pgrx-ci "$RUNNER_TEMP/pgrx-ci/"
      - id: plan
        name: Choose the jobs this change needs
        env:
          # `cargo metadata` needs any recent Cargo, not the pinned toolchain.
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            "$RUNNER_TEMP/pgrx-ci/pgrx-ci" plan --base HEAD^1 --head HEAD
          else
            "$RUNNER_TEMP/pgrx-ci/pgrx-ci" plan --all
          fi

  lint:
    name: rustfmt, clippy, licenses, doc links
    needs: plan
    if: needs.plan.outputs.lint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      RUST_COMPONENTS: clippy
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Restore cargo-deny
        id: deny
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-deny
        if: steps.deny.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run rustfmt
        run: cargo fmt --all -- --check
      - name: Run license check
        run: tools/license-check.sh
      - name: Clippy -Dwarnings sql-entity-graph
        run: cargo clippy -p pgrx-sql-entity-graph -- -Dwarnings
      # Every other crate is checked for clippy errors, not warnings.
      - name: Clippy -Awarnings
        run: cargo clippy --tests --features pg18 --no-default-features -- -Awarnings
      - name: Check doc-links in pgrx-macros
        run: |
          cargo rustdoc -p pgrx-macros -- \
            --document-private-items \
            -Drustdoc::broken-intra-doc-links \
            -Drustdoc::invalid-html-tags
      - name: Check doc-links in pgrx
        run: |
          cargo rustdoc -p pgrx --features pg18 -- \
            --document-private-items \
            -Drustdoc::broken-intra-doc-links \
            -Drustdoc::invalid-html-tags

  # Every package that needs PostgreSQL, against every supported version on every supported
  # platform. Windows has no PostgreSQL 19 binaries yet.
  pg:
    name: ${{ matrix.platform }} PG${{ matrix.pg }}
    needs: plan
    if: needs.plan.outputs.pg != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang 19 changed libclang's spelling locations and Clang 20 added predefined
          # macros, so PG18 and PG19 build with a current Clang and the older versions keep
          # Ubuntu 22.04's Clang 14.
          - { platform: linux-x64, os: ubuntu-22.04, pg: 15, clang: 14 }
          - { platform: linux-x64, os: ubuntu-22.04, pg: 16, clang: 14 }
          - { platform: linux-x64, os: ubuntu-22.04, pg: 17, clang: 14 }
          - { platform: linux-x64, os: ubuntu-22.04, pg: 18, clang: 21 }
          - { platform: linux-x64, os: ubuntu-22.04, pg: 19, clang: 21 }
          # aarch64 Linux is an unsigned-char target, so it covers C char semantics in
          # generated macros and Datum conversions that x86_64 cannot.
          - { platform: linux-arm64, os: ubuntu-24.04-arm, pg: 15 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, pg: 16 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, pg: 17 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, pg: 18 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, pg: 19 }
          # PostgreSQL 16 and later name extension libraries "dylib" on macOS, and PostgreSQL
          # 15 used "so" (see https://github.com/pgcentralfoundation/pgrx/pull/1300).
          - { platform: macos, os: macos-26, pg: 15 }
          - { platform: macos, os: macos-26, pg: 16 }
          - { platform: macos, os: macos-26, pg: 17 }
          - { platform: macos, os: macos-26, pg: 18 }
          - { platform: macos, os: macos-26, pg: 19 }
          - { platform: windows, os: windows-2025, pg: 15 }
          - { platform: windows, os: windows-2025, pg: 16 }
          - { platform: windows, os: windows-2025, pg: 17 }
          - { platform: windows, os: windows-2025, pg: 18 }
    env:
      PG_VER: ${{ matrix.pg }}
      CLANG_VER: ${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the PostgreSQL 19 build
        if: matrix.platform == 'macos' && matrix.pg == 19
        uses: actions/cache@v4
        with:
          # The cache action refuses paths that contain `..`.
          path: ${{ runner.temp }}/pg19
          key: pg19-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pgrx-pg-config/src/lib.rs') }}
      - name: Set up Rust and PostgreSQL ${{ matrix.pg }}
        shell: bash
        env:
          PG19_CACHE: ${{ runner.temp }}/pg19
        run: tools/ci/setup.sh
      # Third-party crates build the same way for every PostgreSQL version, so all of a
      # platform's jobs share the cache that its PG18 job saves on pushes to develop.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pg-${{ matrix.platform }}
          workspaces: |
            . -> target
            . -> target-ext
          cache-bin: "false"
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' && matrix.pg == 18 }}
      - name: Test the packages that need PostgreSQL
        shell: bash
        run: |
          cargo build --locked -p pgrx-ci
          cli_checks=; [ "$RUNNER_OS" = Linux ] && cli_checks=--cli-checks
          target/debug/pgrx-ci test-pg --pg "$PG_VER" --run "${{ needs.plan.outputs.pg }}" $cli_checks

  # The packages that don't need PostgreSQL, on each platform. cargo-pgrx's install
  # regression test installs pgrx-unit-tests, so these jobs still configure PostgreSQL 18.
  crates:
    name: ${{ matrix.platform }} crates
    needs: plan
    if: needs.plan.outputs.crates != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-22.04, clang: 21 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos, os: macos-26 }
          - { platform: windows, os: windows-2025 }
    env:
      PG_VER: 18
      CLANG_VER: ${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and PostgreSQL 18
        shell: bash
        run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: crates-${{ matrix.platform }}
          cache-bin: "false"
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # A cached binary spares every run a download that GitHub's release CDN sometimes refuses.
      - name: Restore cargo-nextest
        id: nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest${{ runner.os == 'Windows' && '.exe' || '' }}
          key: cargo-nextest-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test the packages that don't need PostgreSQL
        shell: bash
        run: |
          cargo build --locked -p pgrx-ci
          target/debug/pgrx-ci test-crates ${{ needs.plan.outputs.crates }}
      # This test builds both slices of a universal installation, so it needs the other
      # slice's standard library. Its synthetic headers make one job enough.
      - name: Run universal macOS binding build harness
        if: matrix.platform == 'macos' && contains(needs.plan.outputs.crates, 'pgrx-bindgen')
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test --locked --package pgrx-bindgen --test macro_build \
            universal_macos_installations_build_both_slices -- --include-ignored --exact --test-threads=1

  # Variants of the PG test build that only Linux runs: pgrx-unit-tests without the C shim,
  # custom_types without schema generation, and a cross build of pgrx-unit-tests for aarch64.
  variants:
    name: linux-x64 PG${{ matrix.pg }} variants
    needs: plan
    if: needs.plan.outputs.variants == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: 15, clang: 14 }
          - { pg: 16, clang: 14 }
          - { pg: 17, clang: 14 }
          - { pg: 18, clang: 21 }
          - { pg: 19, clang: 21 }
    env:
      PG_VER: ${{ matrix.pg }}
      CLANG_VER: ${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and PostgreSQL ${{ matrix.pg }}
        run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: variants
          workspaces: |
            . -> target
            . -> target-ext
            . -> target-cross
          cache-bin: "false"
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' && matrix.pg == 18 }}
      # Generated C macros are checked against the server headers' target, so the aarch64
      # cross build needs headers configured for aarch64. Fetch the arm64 build of the
      # installed postgresql-server-dev package from PGDG.
      - name: Fetch aarch64 PostgreSQL server headers for the cross build
        id: arm64-headers
        run: |
          set -eu
          repo=https://apt.postgresql.org/pub/repos/apt
          cn="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          want="$(dpkg-query -W -f='${Version}' "postgresql-server-dev-$PG_VER")"
          deb=""
          for dist in "$cn-pgdg/main" "$cn-pgdg/$PG_VER" "$cn-pgdg-snapshot/main" "$cn-pgdg-snapshot/$PG_VER"; do
            deb="$(curl -fsSL "$repo/dists/$dist/binary-arm64/Packages.gz" 2>/dev/null | gunzip \
              | awk -v p="postgresql-server-dev-$PG_VER" -v v="$want" \
                  '$1=="Package:"{k=$2} $1=="Version:"{ver=$2} !found && $1=="Filename:" && k==p && ver==v {print $2; found=1}' || true)"
            [ -n "$deb" ] && break
          done
          test -n "$deb" || { echo "no arm64 postgresql-server-dev-$PG_VER $want in PGDG"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/pg-server-dev-arm64.deb" "$repo/$deb"
          dpkg-deb -x "$RUNNER_TEMP/pg-server-dev-arm64.deb" "$RUNNER_TEMP/pg-arm64"
          server="$RUNNER_TEMP/pg-arm64/usr/include/postgresql/$PG_VER/server"
          grep -q 'on aarch64' "$server/pg_config.h" || { echo "fetched headers are not aarch64"; exit 1; }
          echo "server=$server" >> "$GITHUB_OUTPUT"
          sudo apt-get install -y -qq --no-install-recommends crossbuild-essential-arm64 > /dev/null
          rustup target add aarch64-unknown-linux-gnu
      # Only this step sees the target headers; tests elsewhere check that builds without them
      # refuse. Build scripts still generate bindings and C macros from the aarch64 headers and
      # compile the aarch64 C shim; checking skips only Rust code generation and linking, which
      # the arm64 jobs cover natively. It runs beside the other variants, in its own target
      # directory, because it is mostly single-threaded build scripts.
      - name: Build the variants
        env:
          PGRX_INCLUDEDIR_SERVER_aarch64_unknown_linux_gnu: ${{ steps.arm64-headers.outputs.server }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          BINDGEN_EXTRA_CLANG_ARGS_aarch64-unknown-linux-gnu: -target aarch64-unknown-linux-gnu -isystem /usr/aarch64-linux-gnu/include/ -ccc-gcc-name aarch64-linux-gnu-gcc
        run: |
          cargo build --locked -p pgrx-ci
          target/debug/pgrx-ci test-variants --pg "$PG_VER"

  miri:
    name: Miri
    needs: plan
    if: needs.plan.outputs.miri == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      # The nightly is pinned so that a new nightly, or one shipped without Miri, cannot
      # fail this job on its own.
      MIRI_TOOLCHAIN: nightly-2026-10-29
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # Only Miri checks that a pointer Datum keeps its provenance through an integer, and its
      # strict provenance mode makes the fcinfo test reject an integer round trip. In the varlena
      # tests, Miri also reports padding that a typed copy left uninitialized, where a native
      # run reads whatever the stack held.
      - name: Check pointer provenance and PgVarlena padding with Miri
        run: |
          cargo "+$MIRI_TOOLCHAIN" miri test --package pgrx-pg-sys \
            --features "pg$PG_VER" --no-default-features --lib datum
          MIRIFLAGS=-Zmiri-strict-provenance cargo "+$MIRI_TOOLCHAIN" miri test --package pgrx \
            --features "pg$PG_VER" --no-default-features --lib fcinfo
          MIRIFLAGS=-Zmiri-strict-provenance cargo "+$MIRI_TOOLCHAIN" miri test --package pgrx \
            --features "pg$PG_VER" --no-default-features --lib varlena

  # The other jobs load the newest libclang that they install; only this one covers Ubuntu
  # 22.04's own Clang 14 for the C macro generator's tests.
  cmacros-clang14:
    name: pgrx-c-macros with Clang 14
    needs: plan
    if: needs.plan.outputs.cmacros_clang14 == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CLANG_VER: 14
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cmacros-clang14
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Restore cargo-nextest
        id: nextest
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-nextest
          key: cargo-nextest-v1-${{ runner.os }}-${{ runner.arch }}
      - name: Install cargo-nextest
        if: steps.nextest.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --no-fail-fast --package pgrx-c-macros

  # These build isolated fixture crates with synthetic headers, so one job covers them.
  bindgen-harness:
    name: Binding build harnesses
    needs: plan
    if: needs.plan.outputs.bindgen_harness == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CLANG_VER: 21
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bindgen-harness
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # The fixture builds run Cargo offline, and one cross-compiles for aarch64.
      - name: Fetch every locked crate and set up the aarch64 cross build
        run: |
          cargo fetch --locked
          rustup target add aarch64-unknown-linux-gnu
          sudo apt-get install -y -qq --no-install-recommends crossbuild-essential-arm64 > /dev/null
      - name: Run the binding build harnesses
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          BINDGEN_EXTRA_CLANG_ARGS_aarch64-unknown-linux-gnu: -target aarch64-unknown-linux-gnu -isystem /usr/aarch64-linux-gnu/include/ -ccc-gcc-name aarch64-linux-gnu-gcc
        run: |
          cargo test --locked --package pgrx-bindgen \
            --test macro_build --test shipped_macros -- --include-ignored --test-threads=1

  # These tests are ignored by default because each compiles its own copy of pgrx. Neither
  # depends on the PostgreSQL version, so they run once, here.
  ui:
    name: UI tests
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      CLANG_VER: 21
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ui
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - run: |
          cargo test --locked --features "pg$PG_VER proptest" \
            --package pgrx-unit-tests --test ui -- --ignored

  # A debug build of the benching example smoke-tests `cargo pgrx bench`.
  bench:
    name: cargo pgrx bench
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      CLANG_VER: 21
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - run: |
          cargo build --locked -p cargo-pgrx
          target/debug/cargo-pgrx pgrx bench pg$PG_VER \
            bench_normalize_phrase \
            --debug \
            --manifest-path=pgrx-examples/benching/Cargo.toml \
            --group-name ci_benching_smoke

  install-regression:
    name: cargo pgrx install from a virtual workspace
    needs: plan
    if: needs.plan.outputs.install_regression == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      CLANG_VER: 21
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: install-regression
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # The crates jobs skip these tests, so this job runs the ignored one and the others.
      - run: cargo test --locked --package cargo-pgrx --test install_pg_test_regression -- --include-ignored

  runas:
    name: cargo pgrx test --runas
    needs: plan
    if: needs.plan.outputs.runas == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 15
      CLANG_VER: 14
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: runas
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Test cargo pgrx test --runas
        run: |
          cargo build --locked -p cargo-pgrx
          echo 0 | sudo tee /proc/sys/fs/protected_fifos
          cd pgrx-examples/arrays && ../../target/debug/cargo-pgrx pgrx test pg$PG_VER --runas postgres --pgdata=/tmp/pgdata

  # `cargo pgrx init` downloads and compiles PostgreSQL, then a new extension from the
  # template is tested against this checkout's pgrx.
  init:
    name: cargo pgrx init and new
    needs: plan
    if: needs.plan.outputs.init == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 15
      CLANG_VER: 14
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: init
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Install PostgreSQL's build dependencies
        run: |
          sudo apt-get install -y -qq --no-install-recommends \
            bison flex libicu-dev libreadline-dev libssl-dev pkg-config zlib1g-dev > /dev/null
      - name: Install cargo-pgrx
        run: cargo install --locked --path cargo-pgrx/ --debug --force --target-dir target
      - name: Run 'cargo pgrx init'
        run: PGRX_HOME="$RUNNER_TEMP/pgrx-home-download" cargo pgrx init --pg$PG_VER download
      - name: Create a new extension
        run: cd "$RUNNER_TEMP" && cargo pgrx new sample
      - name: Use this checkout's pgrx in the new extension
        run: |
          {
            echo "[patch.crates-io]"
            echo "pgrx-bench  = { path = \"${GITHUB_WORKSPACE}/pgrx-bench\"  }"
            echo "pgrx        = { path = \"${GITHUB_WORKSPACE}/pgrx\"        }"
            echo "pgrx-macros = { path = \"${GITHUB_WORKSPACE}/pgrx-macros\" }"
            echo "pgrx-tests  = { path = \"${GITHUB_WORKSPACE}/pgrx-tests\"  }"
          } >> "$RUNNER_TEMP/sample/Cargo.toml"
          cat "$RUNNER_TEMP/sample/Cargo.toml"
      # Sharing the workspace's target directory reuses the build dependencies and proc
      # macros that the steps above compiled, where the sample resolves the same versions.
      - name: Test the new extension against the downloaded PostgreSQL
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cd "$RUNNER_TEMP/sample" && PGRX_HOME="$RUNNER_TEMP/pgrx-home-download" cargo pgrx test pg$PG_VER

  # aarch64 release builds without LTO and with many codegen units keep `.pgrxsc` only if
  # SHF_GNU_RETAIN survives LLVM, binutils and `ld --gc-sections`, which has broken in the
  # wild (see the pglinter 0.18.0 failure). If cargo-pgrx's injected `--no-gc-sections`
  # workaround regresses, schema generation fails with "no embedded pgrx schema section found".
  schema-release:
    name: linux-arm64 cargo pgrx schema --release
    needs: plan
    if: needs.plan.outputs.schema_release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PG_VER: 17
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-release
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Exercise cargo pgrx schema --release against pgrx-unit-tests
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo build --locked -p cargo-pgrx
          cd pgrx-unit-tests && ../target/debug/cargo-pgrx pgrx schema pg$PG_VER --release

  # A new compiler almost always breaks the build rather than a test, so Rust beta only
  # builds the tests.
  beta:
    name: Rust beta build
    needs: plan
    if: needs.plan.outputs.beta == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 18
      CLANG_VER: 21
      # rust-toolchain.toml would otherwise select the pinned stable toolchain.
      RUSTUP_TOOLCHAIN: beta
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - run: rustup toolchain install beta --profile minimal --component rustfmt && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: beta
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Build the workspace tests with Rust beta
        run: |
          cargo test --locked --workspace --no-run --exclude pgrx-unit-tests \
            --features "pg$PG_VER" --no-default-features
          cargo test --locked --no-run --features "pg$PG_VER cshim proptest" --package pgrx-unit-tests --lib
          cargo test --locked --no-run --features "pg$PG_VER proptest" --package pgrx-unit-tests

  package:
    name: Package
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PG_VER: 15
      CLANG_VER: 14
      # Any rustc warning or Cargo lint fails this job, including the manifest lints
      # `cargo publish` reports. Workspace-level lints appear only in builds inside the
      # workspace, such as installing cargo-pgrx, rather than in packaged-crate builds.
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      - name: Test pgrx can be packaged as a new version
        run: |
          ./update-versions.sh 0.0.999-rc.999
          cargo package \
            --allow-dirty \
            -p pgrx-pg-config \
            -p pgrx-c-macros \
            -p pgrx-bindgen \
            -p pgrx-sql-entity-graph \
            -p pgrx-macros \
            -p pgrx-pg-sys \
            -p pgrx \
            -p pgrx-bench \
            -p pgrx-tests \
            -p cargo-pgrx \
            --features "pg$PG_VER"

  docsrs:
    name: docs.rs builds
    needs: plan
    if: needs.plan.outputs.package == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/setup.sh
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docsrs
          save-if: ${{ env.SAVE_RUST_CACHE == 'true' }}
      # docs.rs builds need neither PostgreSQL nor libclang. This checks every supported
      # version against the committed bindings and C macro snapshot on docs.rs's target.
      - name: Type-check the docs.rs builds of pgrx-pg-sys and pgrx
        run: ./tools/docsrs-typecheck.sh
      - name: Verify docs.rs build path
        run: ./tools/docsrs-check.sh
