name: Nightly cross-compilation packages

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to test (empty uses the selected workflow ref)
        type: string
        required: false

permissions:
  contents: read

jobs:
  # A target bundle is generated on the platform an extension will run on, from that
  # platform's own PostgreSQL 18, and is all another machine needs to package for it.
  bundle:
    name: PG18 bundle on ${{ matrix.name }}
    if: github.event_name != 'schedule' || github.repository == 'pgcentralfoundation/pgrx'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux ARM64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: Linux x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { name: macOS ARM64, runner: macos-26, target: aarch64-apple-darwin }
          - { name: Windows MSVC x64, runner: windows-2025, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      PG_VER: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install Rust, Clang and PostgreSQL 18
        run: tools/ci/setup.sh

      - name: Generate the bundle
        run: |
          out="${RUNNER_TEMP//\\//}/bundle"
          cargo build --locked --package cargo-pgrx
          target/debug/cargo-pgrx pgrx package --package versioned_so --debug --bundle-generate \
            --pg-config "$PG_CONFIG" --out-dir "$out" --cargo=--locked
          # The name starts with the pgrx version that generated the bundle.
          full=("$out"/pgrx-*-pg18-'${{ matrix.target }}'.tar.gz)
          test "${#full[@]}" -eq 1 && test -f "${full[0]}"

      # The script is for a target with no Rust or Clang, so it runs on every platform here,
      # under Git Bash on Windows, and one route below builds from what it collects.
      - name: Collect a partial bundle with the shell script
        run: |
          out="${RUNNER_TEMP//\\//}/bundle"
          partial="$(sh tools/pgrx-collect-bundle.sh --target='${{ matrix.target }}' \
            --pg-config="$PG_CONFIG" --out-dir="$out")"
          test "$partial" = "$out/pgrx-pg18-${{ matrix.target }}.partial.tar.gz"
          tar -tzf - < "$partial" > "$out/partial-contents.txt"
          for member in partial-bundle target pg_config.txt include/server/pg_config.h; do
            grep -qx "$member" "$out/partial-contents.txt"
          done
          # It holds headers and pg_config's output: nothing generated, nothing compiled.
          if grep -e '^target-info' -e '\.rs$' -e '\.a$' "$out/partial-contents.txt"; then
            exit 1
          fi
          if [[ '${{ matrix.target }}' == *-msvc ]]; then
            grep -qx 'lib/postgres.lib' "$out/partial-contents.txt"
            grep -q '^include/pkg/' "$out/partial-contents.txt"
          fi
          rm "$out/partial-contents.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 7

  package:
    name: ${{ matrix.name }} PG18
    needs: bundle
    # Run each route whose bundle exists, even when another platform's bundle job failed; a
    # route without its bundle fails at the download.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || github.repository == 'pgcentralfoundation/pgrx') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-to-linux-arm64
            name: Linux x64 to Linux ARM64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            os: linux
          # The same route from a partial bundle: this job generates from the target's
          # collected headers, so it also runs Clang for the target.
          - id: linux-to-linux-arm64-partial
            name: Linux x64 to Linux ARM64 from a partial bundle
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            os: linux
            bundle: .partial
          - id: linux-to-macos-arm64
            name: Linux x64 to macOS ARM64
            runner: ubuntu-24.04
            target: aarch64-apple-darwin
            os: macos
          - id: macos-to-linux-x64
            name: macOS ARM64 to Linux x64
            runner: macos-26
            target: x86_64-unknown-linux-gnu
            os: linux
          - id: linux-to-windows-x64
            name: Linux x64 to Windows MSVC x64
            runner: ubuntu-24.04
            target: x86_64-pc-windows-msvc
            os: windows
          - id: windows-to-linux-x64
            name: Windows MSVC x64 to Linux x64
            runner: windows-2025
            target: x86_64-unknown-linux-gnu
            os: linux
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: '1'
      CARGO_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_BUILD_OVERRIDE_DEBUG: '0'
      CROSS_TARGET: ${{ matrix.target }}
      # Empty for a full bundle, `.partial` for a collected one.
      CROSS_BUNDLE_KIND: ${{ matrix.bundle }}
      CROSS_OS: ${{ matrix.os }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare a directory for the job's files
        run: |
          root="${RUNNER_TEMP//\\//}/cross-package"
          mkdir -p "$root/diagnostics"
          echo "CROSS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Install the repository Rust toolchain and target
        run: |
          # Without a name, rustup installs the toolchain rust-toolchain.toml names.
          tools/ci/retry.sh rustup toolchain install --no-self-update
          tools/ci/retry.sh rustup target add "$CROSS_TARGET"
          rustc -vV

      - name: Install native Linux LLVM
        if: runner.os == 'Linux'
        run: |
          llvm=18
          if [[ "$CROSS_OS" == windows ]]; then
            llvm=21
            curl -fsSL --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo tee /usr/share/keyrings/pgrx-nightly-llvm.asc > /dev/null
            echo 'deb [signed-by=/usr/share/keyrings/pgrx-nightly-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' \
              | sudo tee /etc/apt/sources.list.d/pgrx-nightly-llvm.list > /dev/null
          fi
          tools/ci/retry.sh sudo apt-get update -qq
          tools/ci/retry.sh sudo apt-get install -y -qq --no-install-recommends \
            "clang-$llvm" "libclang-$llvm-dev" "llvm-$llvm" "lld-$llvm"
          echo "CLANG_PATH=/usr/bin/clang-$llvm" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=/usr/lib/llvm-$llvm/lib" >> "$GITHUB_ENV"
          echo "LLVM_BIN=/usr/lib/llvm-$llvm/bin" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-$llvm/bin" >> "$GITHUB_PATH"

      - name: Install native macOS LLVM
        if: runner.os == 'macOS'
        run: |
          tools/ci/retry.sh brew install llvm
          llvm="$(brew --prefix llvm)"
          echo "CLANG_PATH=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$llvm/lib" >> "$GITHUB_ENV"
          echo "LLVM_BIN=$llvm/bin" >> "$GITHUB_ENV"
          echo "$llvm/bin" >> "$GITHUB_PATH"
          "$llvm/bin/clang" --version
          brew list --versions llvm

      - name: Install native Windows LLVM 21
        if: runner.os == 'Windows'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21.1.8'
          arch: x64
          directory: ${{ runner.temp }}/llvm
          env: false

      - name: Select matching native Windows Clang and libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "$env:RUNNER_TEMP/llvm/bin"
          foreach ($file in 'clang.exe', 'libclang.dll', 'llvm-ar.exe', 'llvm-readobj.exe') {
            if (-not (Test-Path "$bin/$file")) { throw "Missing LLVM tool: $file" }
          }
          "CLANG_PATH=$bin/clang.exe" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=$bin" >> $env:GITHUB_ENV
          "LLVM_BIN=$bin" >> $env:GITHUB_ENV
          $bin >> $env:GITHUB_PATH

      - name: Build cargo-pgrx and the checks for the native host
        run: |
          cargo build --locked --package cargo-pgrx --package pgrx-ci
          file target/debug/cargo-pgrx*
          "$CLANG_PATH" --version

      - name: Download Zig 0.17.1 for the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/zig.zip"
          Invoke-WebRequest https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $expected = 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Zig archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/zig"
          $zig = "$env:RUNNER_TEMP/zig/zig-x86_64-windows-0.17.1"
          & "$zig/zig.exe" version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zig >> $env:GITHUB_PATH
          "CARGO_ZIGBUILD_ZIG_PATH=$zig/zig.exe" >> $env:GITHUB_ENV

      - name: Download cargo-zigbuild 0.24.1 for the Windows host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = 'https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1'
          $name = 'cargo-zigbuild-x86_64-pc-windows-msvc.zip'
          $archive = "$env:RUNNER_TEMP/$name"
          Invoke-WebRequest "$base/$name" -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          Invoke-WebRequest "$base/$name.sha256" -OutFile "$archive.sha256" -MaximumRetryCount 3 -RetryIntervalSec 5
          $digest = ((Get-Content "$archive.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest.ToLowerInvariant()) {
            throw 'cargo-zigbuild archive checksum mismatch'
          }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/cargo-zigbuild"
          $executables = @(Get-ChildItem "$env:RUNNER_TEMP/cargo-zigbuild" -Recurse -Filter cargo-zigbuild.exe)
          if ($executables.Count -ne 1) { throw 'Expected one cargo-zigbuild.exe' }
          "CARGO_ZIGBUILD_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV

      - name: Select Zig for nested Linux Cargo builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $adapter = "$env:RUNNER_TEMP/cargo-for-linux.cmd"
          @('@echo off', 'set CARGO=', '"%CARGO_ZIGBUILD_EXE%" %*') |
            Set-Content -Path $adapter -Encoding ascii
          "CARGO=$adapter" >> $env:GITHUB_ENV
          "CARGO_ZIGBUILD_CACHE_DIR=$env:RUNNER_TEMP/zig-cargo-cache" >> $env:GITHUB_ENV

      - name: Install the Linux ARM64 GNU cross compiler
        if: runner.os == 'Linux' && matrix.os == 'linux'
        run: |
          tools/ci/retry.sh sudo apt-get install -y -qq --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
          {
            echo 'TARGET_CC=aarch64-linux-gnu-gcc'
            echo 'TARGET_CXX=aarch64-linux-gnu-g++'
            echo 'TARGET_MAKE=make'
            echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc'
            echo 'CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc'
            echo 'CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++'
            echo 'AR_aarch64_unknown_linux_gnu=llvm-ar'
          } >> "$GITHUB_ENV"
          # Only a build from a partial bundle runs Clang for the target. A full bundle's route
          # gets no target Clang arguments, which shows that it needs none.
          if [[ -n "$CROSS_BUNDLE_KIND" ]]; then
            echo 'BINDGEN_EXTRA_CLANG_ARGS_aarch64_unknown_linux_gnu=-isystem /usr/aarch64-linux-gnu/include -ccc-gcc-name aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
          fi

      - name: Install the macOS-hosted Linux GNU cross compiler
        if: runner.os == 'macOS'
        run: |
          tools/ci/retry.sh brew tap messense/macos-cross-toolchains
          git -C "$(brew --repo messense/macos-cross-toolchains)" checkout 473d950430a5149f71a82e8c546638f581bb7e0d
          tools/ci/retry.sh brew install messense/macos-cross-toolchains/x86_64-unknown-linux-gnu
          cc="$(command -v x86_64-linux-gnu-gcc)"
          sysroot="$("$cc" -print-sysroot)"
          toolchain="$(brew --prefix x86_64-unknown-linux-gnu)/toolchain"
          test -d "$sysroot/usr/include"
          "$cc" --version
          file "$cc"
          {
            echo "TARGET_CC=$cc"
            echo "TARGET_CXX=$(command -v x86_64-linux-gnu-g++)"
            echo 'TARGET_MAKE=gmake'
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=$cc"
            echo "CC_x86_64_unknown_linux_gnu=$cc"
            echo "CXX_x86_64_unknown_linux_gnu=$(command -v x86_64-linux-gnu-g++)"
            echo 'AR_x86_64_unknown_linux_gnu=llvm-ar'
          } >> "$GITHUB_ENV"

      - name: Restore the macOS SDK and Linux-hosted linker
        if: matrix.os == 'macos'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/osxcross
          key: nightly-osxcross-linux-x64-15.5-r0-ab9cb3c178279fb1

      - name: Prepare the macOS cross compiler
        if: matrix.os == 'macos'
        run: |
          toolchain="$RUNNER_TEMP/osxcross"
          if [[ ! -x "$toolchain/bin/oa64-clang" ]]; then
            image=ghcr.io/crazy-max/osxcross:15.5-r0-ubuntu@sha256:ab9cb3c178279fb1c1d94b87d2ec860969f07ba154466aacc593ece6dcafd62f
            tools/ci/retry.sh docker pull "$image"
            container="$(docker create "$image" unused)"
            trap 'docker rm "$container" > /dev/null' EXIT
            docker cp "$container:/osxcross" "$toolchain"
            docker rm "$container" > /dev/null
            trap - EXIT
          fi
          echo "$toolchain/bin" >> "$GITHUB_PATH"
          {
            echo "LD_LIBRARY_PATH=$toolchain/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            echo "OSXCROSS_SDKROOT=$toolchain/SDK/MacOSX15.5.sdk"
            echo 'MACOSX_DEPLOYMENT_TARGET=11.0'
            echo "TARGET_CC=$toolchain/bin/oa64-clang"
            echo "TARGET_CXX=$toolchain/bin/oa64-clang++"
            echo 'TARGET_MAKE=make'
            echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$toolchain/bin/oa64-clang"
            echo "CC_aarch64_apple_darwin=$toolchain/bin/oa64-clang"
            echo "CXX_aarch64_apple_darwin=$toolchain/bin/oa64-clang++"
            echo 'AR_aarch64_apple_darwin=llvm-ar'
          } >> "$GITHUB_ENV"

      - name: Download cargo-xwin and prepare the MSVC SDK
        if: matrix.os == 'windows'
        run: |
          base=https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1
          name=cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$RUNNER_TEMP/cargo-xwin"
          curl -fSL --retry 3 "$base/$name" -o "$RUNNER_TEMP/$name"
          curl -fsSL --retry 3 "$base/$name.sha256" -o "$RUNNER_TEMP/$name.sha256"
          expected="$(awk '{print $1}' "$RUNNER_TEMP/$name.sha256")"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$name" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$name" -C "$RUNNER_TEMP/cargo-xwin"
          executable="$(find "$RUNNER_TEMP/cargo-xwin" -type f -name cargo-xwin)"
          test -n "$executable"
          test "$(printf '%s\n' "$executable" | wc -l)" -eq 1
          export PATH="$(dirname "$executable"):$PATH"
          export XWIN_CACHE_DIR="$RUNNER_TEMP/xwin-cache" XWIN_ARCH=x86_64
          cargo xwin env --target "$CROSS_TARGET" > "$CROSS_ROOT/xwin-env.sh"
          echo "CROSS_ENV_FILE=$CROSS_ROOT/xwin-env.sh" >> "$GITHUB_ENV"

      - name: Download the target's bundle
        uses: actions/download-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: ${{ runner.temp }}/bundle

      - name: Leave nothing but the bundle to describe the target
        run: |
          downloaded="${RUNNER_TEMP//\\//}/bundle"
          if [[ -z "$CROSS_BUNDLE_KIND" ]]; then
            bundle=$(echo "$downloaded"/pgrx-*-pg18-"$CROSS_TARGET".tar.gz)
          else
            bundle="$downloaded/pgrx-pg18-$CROSS_TARGET$CROSS_BUNDLE_KIND.tar.gz"
          fi
          test -f "$bundle"
          missing="$CROSS_ROOT/no-pg-config"
          test ! -e "$missing"
          {
            echo "CROSS_BUNDLE=$bundle"
            # These must never be consulted while a bundle describes the target's PostgreSQL.
            echo "PG_CONFIG=$missing"
            echo "PGRX_PG_CONFIG_PATH=$missing"
          } >> "$GITHUB_ENV"

      # Packages versioned_so and packaging, then checks each package's files, control file and
      # SQL, the library's format, architecture and type, and for Linux the RPM and DEB, against
      # the layout the bundle's PostgreSQL reported. No packaged code runs.
      - name: Package both examples from the bundle and check them
        run: |
          if [[ -n "${LLVM_BIN:-}" ]]; then export PATH="$LLVM_BIN:$PATH"; fi
          if [[ -n "${CROSS_ENV_FILE:-}" ]]; then source "$CROSS_ENV_FILE"; fi
          if [[ -z "$CROSS_BUNDLE_KIND" ]]; then
            # A full bundle needs no Clang for pgrx, so point pgrx at none to show it.
            export CLANG_PATH=/nonexistent/clang LIBCLANG_PATH=/nonexistent
          fi
          target/debug/pgrx-ci cross-package --bundle "$CROSS_BUNDLE"

      - name: Collect target configuration diagnostics
        if: always()
        run: |
          for report in target/*/debug/build/pgrx-pg-sys-*/out/pg18_macro_report.json; do
            if [[ -f "$report" ]]; then
              build="${report%/out/*}"
              cp "$report" "$CROSS_ROOT/diagnostics/${build##*/}-pg18-macros.json"
            fi
          done

      - name: Upload packages and configuration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-pg18-${{ matrix.id }}
          path: |
            target/cross-package/packages
            ${{ env.CROSS_ROOT }}/diagnostics
          if-no-files-found: warn
          retention-days: 7
