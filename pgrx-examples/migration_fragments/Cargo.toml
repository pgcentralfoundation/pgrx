[package]
name = "migration_fragments"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg13"]
pg13 = ["pgrx/pg13", "pgrx-tests/pg13"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19"]
pg_test = []

[dependencies]
pgrx = { path = "../../pgrx" }

[dev-dependencies]
pgrx-tests = { path = "../../pgrx-tests" }

# This key is the whole opt-in. Without it, `cargo pgrx` ignores `sql/unreleased/`.
[package.metadata.pgrx]
unreleased-sql-dir = "sql/unreleased"
