[package]
name = "pgrx-bindgen"
description = "additional bindgen support for pgrx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/pgrx-bindgen"

[dependencies]
pgrx-pg-config.workspace = true
pgrx-c-macros = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true

eyre.workspace = true
proc-macro2.workspace = true
regex.workspace = true
syn.workspace = true
toml.workspace = true
walkdir.workspace = true

bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
quote = "1.0.47"
shlex = "2.0" # shell lexing, also used by many of our deps
