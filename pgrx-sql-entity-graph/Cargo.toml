[package]
name = "pgrx-sql-entity-graph"
version.workspace = true
authors.workspace = true
license.workspace = true
description = "Sql Entity Graph for `pgrx`"
repository.workspace = true
documentation = "https://docs.rs/pgrx-sql-entity-graph"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
include = ["src/**/*", "README.md"]

[features]
no-schema-generation = []

[dependencies]
eyre.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
thiserror.workspace = true

[lints.clippy]
assigning_clones = "allow" # wrong diagnosis and wrong suggestions
too_many_arguments = "allow" # I argue with myself all the time
